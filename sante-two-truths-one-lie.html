<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#112c33">
<title>Sante Taipei | 兩真一假</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#153138;background:#eef1ec}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 95% 0%,#dae6dd 0%,transparent 55%),#eef1ec}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:580px;margin:auto;min-height:100dvh;padding:24px 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:14px;font-weight:900;letter-spacing:.16em}.brand small{display:block;letter-spacing:.03em;font-weight:500;font-size:10px;color:#728583;margin-top:4px}.pill{background:#dde9df;color:#3b6152;border:1px solid #d2dfd4;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700}.hero{background:#153b42;color:white;border-radius:25px;padding:26px;position:relative;overflow:hidden;box-shadow:0 14px 30px #092e3315}.hero:after{content:'✳';position:absolute;right:-8px;top:-35px;font-size:180px;color:#ffffff0c}.eyebrow{font-size:11px;letter-spacing:.19em;color:#bcd2c4;font-weight:700}.hero h1{font-size:42px;line-height:1.16;margin:11px 0 15px;letter-spacing:.04em}.hero p{font-size:14px;line-height:1.8;color:#d1dedb;max-width:330px;margin:0}.section{background:#fff;border:1px solid #e0e8e2;border-radius:19px;padding:22px;margin-top:16px;box-shadow:0 4px 20px #26453808}.section h2{margin:0 0 12px;font-size:20px}.section p{line-height:1.7;font-size:14px;color:#657873}.muted{color:#788983;font-size:12px}.field{margin:14px 0}.field label{font-weight:700;display:block;font-size:13px;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid #dce5de;background:#f8faf8;border-radius:12px;padding:14px;color:#153138;outline:none;resize:vertical}.field input:focus,.field textarea:focus{border-color:#548b73}.field textarea{min-height:73px}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;background:#173e44;color:white;font-size:14px;font-weight:800;margin-top:8px}.btn.secondary{background:#e5eee8;color:#244c43}.btn.ghost{border:1px solid #d7e3dc;background:white;color:#244c43}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row .btn{width:auto;flex:1}.rule{border:0;border-top:1px solid #ecf0ec;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:#f3f7f3;border-radius:12px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#71847c}.member{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf1ec;padding:11px 0;font-size:14px}.member:last-child{border:0}.tag{font-size:11px;color:#40745a;background:#e7f2e7;border-radius:99px;padding:5px 9px}.choice{display:flex;gap:12px;align-items:center;padding:15px;text-align:left;background:#f8faf8;width:100%;margin:9px 0;border:1px solid #e1e9e4;border-radius:13px;line-height:1.6;color:#18383a}.choice .num{flex:none;width:29px;height:29px;border-radius:50%;background:#e8f0e9;display:grid;place-items:center;font-weight:800}.choice.selected{background:#e7f1e8;border:2px solid #3b8266;padding:14px}.choice.correct{background:#d6ede0;border:2px solid #28744e;padding:14px}.mini{font-size:11px;color:#80918b}.notice{padding:13px 15px;background:#eff5ef;border-radius:12px;font-size:13px;line-height:1.7;color:#3e6957;margin-top:14px}.warning{background:#fbf1df;color:#86692f}.hidden{display:none!important}.cent{text-align:center}.bigcode{font-size:34px;letter-spacing:.16em;font-weight:900;margin:6px 0}.footer{text-align:center;color:#91a39a;font-size:11px;margin-top:26px;line-height:1.8}.vote-bar{height:7px;background:#e1eae3;border-radius:20px;overflow:hidden;margin:5px 0 11px}.vote-bar>i{display:block;height:100%;background:#4e9275}.roundtitle{font-size:14px;font-weight:800;color:#527966}.error{color:#b24b3b!important}.copy{padding:7px 10px;border:0;border-radius:9px;color:#305948;background:#e7f0e9;font-weight:700}.divider-head{display:flex;justify-content:space-between;align-items:center}.subheading{font-size:12px;letter-spacing:.12em;color:#58806f;font-weight:800}.score{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0ec}.score:last-child{border:0}.score b{font-size:19px}.light{background:#ffffffa6;border:1px solid #dae5dc;border-radius:14px;padding:13px;margin-top:12px}@media(max-width:380px){.hero h1{font-size:35px}.shell{padding:18px 13px 40px}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand">SANTE TAIPEI<small>RIDE TOGETHER · CONNECT BEYOND</small></div><span class="pill">SOCIAL GAMES / 01</span></header><div id="app"></div><footer class="footer">Sante Taipei · Two Truths & One Lie<br>測試版｜本機資料儲存，非跨裝置網路連線</footer></main>
<script>
(()=>{
'use strict';const DB='sante_tt1_v1_',SESSION='sante_tt1_session',app=document.getElementById('app');let session=JSON.parse(sessionStorage.getItem(SESSION)||'null'), flash='';const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,9);const roomKey=c=>DB+c;const room=()=>session?JSON.parse(localStorage.getItem(roomKey(session.code))||'null'):null;const save=r=>{r.updated=Date.now();localStorage.setItem(roomKey(r.code),JSON.stringify(r));render()};const setSession=s=>{session=s;sessionStorage.setItem(SESSION,JSON.stringify(s));render()};const getMe=r=>r.people.find(p=>p.id===session?.pid);const host=r=>getMe(r)?.host===true;const alertMsg=t=>{flash=t;render()};const info=()=>flash?`<div class="notice warning">${escape(flash)}</div>`:'';const hero=(sub='TWO TRUTHS & ONE LIE')=>`<div class="hero"><div class="eyebrow">${sub}</div><h1>兩真一假<span style="color:#aad6b8">.</span></h1><p>三句話，兩句是真的，一句是假的。猜猜誰最會藏秘密，一起認識騎行夥伴。</p></div>`;
function landing(){const pre=new URLSearchParams(location.search).get('room')||'';app.innerHTML=hero()+`<section class="section"><h2>開始一場連結</h2><p>由關主建立房間、邀請小隊加入。手機開啟即可玩，不需要下載 App。</p><div class="field"><label>你的暱稱</label><input id="name" maxlength="20" placeholder="例如：小安"></div><button class="btn" data-action="create">我是關主 · 建立房間</button><hr class="rule"><div class="field"><label>房間代碼</label><input id="code" maxlength="6" inputmode="numeric" value="${escape(pre)}" placeholder="輸入 6 位房號"></div><button class="btn secondary" data-action="join">我是參與者 · 加入房間</button>${info()}</section><div class="notice warning">此版本可在同一台裝置的多個瀏覽器分頁，模擬不同玩家；尚未連接線上伺服器，因此<strong>不能讓其他手機直接加入</strong>。</div>`}
function lobby(r){let me=getMe(r), ishost=host(r), submitted=r.people.filter(p=>p.statements?.length===3).length;app.innerHTML=hero('ROOM '+escape(r.code))+`<section class="section"><div class="divider-head"><div><div class="subheading">${escape(r.title)}</div><div class="bigcode">${escape(r.code)}</div></div><button class="copy" data-action="copy">複製邀請</button></div><div class="stats"><div class="stat"><b>${r.people.length}</b><span>加入人數</span></div><div class="stat"><b>${submitted}</b><span>完成出題</span></div><div class="stat"><b>${r.round+1}</b><span>預備回合</span></div></div><div class="subheading">房間成員</div>${r.people.map(p=>`<div class="member"><span>${escape(p.name)} ${p.host?'<span class="tag">關主</span>':''}</span><span class="muted">${p.statements?.length===3?'✓ 已出題':'尚未出題'}</span></div>`).join('')}<div class="notice">每個人先準備三句關於自己的話，其中兩句是真話、一句是假話。遊戲時其他人投票猜假話。</div>${ishost?`<button class="btn" data-action="start" ${submitted===0||r.people.length<2?'disabled':''}>開始遊戲（${submitted} 人已出題）</button>`:'<div class="notice">等候關主開始遊戲。你可以先完成自己的題目。</div>'}<button class="btn secondary" data-action="edit">${me.statements?.length===3?'修改我的三句話':'填寫我的三句話'}</button><button class="btn ghost" data-action="leave">離開房間</button>${info()}</section>`}
function editor(r){let me=getMe(r), a=me.statements||['','',''];app.innerHTML=`<div class="section"><span class="subheading">SANTE TAIPEI · 準備題目</span><h2>寫下你的兩真一假</h2><p>請寫三件關於自己的事，選出其中唯一的一句假話。順序不固定，讓大家更難猜！</p>${a.map((s,i)=>`<div class="field"><label>第 ${i+1} 句</label><textarea id="statement${i}" maxlength="130" placeholder="例如：我曾經一天騎超過 100 公里">${escape(s)}</textarea></div>`).join('')}<div class="field"><label>哪一句是假話？</label><div class="row" style="margin-top:8px">${[0,1,2].map(i=>`<label class="light" style="flex:1;text-align:center;margin:0"><input type="radio" name="lie" value="${i}" ${me.lie===i?'checked':''}> 第 ${i+1} 句</label>`).join('')}</div></div><button class="btn" data-action="submit">儲存我的題目</button><button class="btn secondary" data-action="back">返回房間</button>${info()}</div>`}
function active(r){let me=getMe(r), h=host(r), subject=r.people.find(p=>p.id===r.order[r.round]);if(!subject){return finished(r)}const votes=r.votes||{}, current=votes[me.id], total=Object.keys(votes).length, eligible=r.people.filter(p=>p.id!==subject.id);const isOwner=subject.id===me.id;let reveal=r.phase==='reveal';app.innerHTML=`<div class="section"><div class="divider-head"><span class="subheading">ROUND ${r.round+1} / ${r.order.length}</span><span class="pill">${reveal?'答案揭曉':'投票進行中'}</span></div><h2 style="margin-top:14px">${escape(subject.name)} 的兩真一假</h2><p>${reveal?'看看誰猜中了！':isOwner?'這是你的題目，請等待其他隊員猜測。':'三句話中，哪一句是假的？請選擇。'}</p>${subject.statements.map((s,i)=>`<button class="choice ${current===i?'selected':''} ${reveal&&subject.lie===i?'correct':''}" data-action="vote" data-val="${i}" ${reveal||isOwner?'disabled':''}><span class="num">${i+1}</span><span>${escape(s)} ${reveal&&subject.lie===i?'<strong style="color:#28744e">（假話）</strong>':''}</span></button>`).join('')}<div class="notice">${reveal?`正確答案：第 ${subject.lie+1} 句。${!isOwner?(current===subject.lie?'恭喜，你猜對了！':'這次沒猜中，下次再接再厲！'):'輪到你分享故事囉！'}`:isOwner?`已有 ${total} / ${eligible.length} 人投票。`:current!==undefined?'你已完成投票，等待關主揭曉。':`已有 ${total} / ${eligible.length} 人投票。`}</div>${reveal?`<h3>投票結果</h3>${subject.statements.map((s,i)=>{const n=Object.values(votes).filter(v=>v===i).length;return `<div class="mini">第 ${i+1} 句 · ${n} 票 ${i===subject.lie?'✓':''}</div><div class="vote-bar"><i style="width:${total?Math.round(n/total*100):0}%"></i></div>`}).join('')}`:''}${h?reveal?`<button class="btn" data-action="next">${r.round+1>=r.order.length?'查看最終排行榜':'下一位玩家 →'}</button>`:`<button class="btn" data-action="reveal">公布答案 ${total}/${eligible.length}</button>`:'<div class="notice">由關主操作遊戲進度。</div>'}${info()}</div>`}
function finished(r){let list=[...r.people].sort((a,b)=>(b.score||0)-(a.score||0));app.innerHTML=`<div class="hero"><div class="eyebrow">GAME COMPLETE</div><h1>玩得漂亮！</h1><p>每一次猜測，都是更認識彼此的開始。</p></div><section class="section"><h2>本場排行榜</h2><p>每猜中一題得 1 分。出題本人不參與該題投票。</p>${list.map((p,i)=>`<div class="score"><span>${['🥇','🥈','🥉'][i]||'✳'} ${escape(p.name)} ${p.host?'<span class="tag">關主</span>':''}</span><b>${p.score||0} <small style="font-size:11px">分</small></b></div>`).join('')}${host(r)?'<button class="btn" data-action="restart">再玩一局（保留房間成員）</button>':''}<button class="btn secondary" data-action="leave">返回首頁</button></section>`}
function render(){let r=room();if(!session||!r||!getMe(r)){session=null;sessionStorage.removeItem(SESSION);return landing()}if(r.phase==='lobby'&&session.editing)return editor(r);if(r.phase==='lobby')return lobby(r);if(r.phase==='play'||r.phase==='reveal')return active(r);if(r.phase==='finished')return finished(r)}
function write(action,val){let r=room();flash='';if(action==='create'||action==='join'){const name=(document.getElementById('name')?.value||'').trim();if(!name)return alertMsg('請先輸入暱稱。');if(action==='create'){let code;do{code=String(Math.floor(100000+Math.random()*900000))}while(localStorage.getItem(roomKey(code)));r={code,title:'小隊遊戲房',people:[{id:uid(),name,host:true,score:0}],phase:'lobby',order:[],round:0,votes:{},updated:Date.now()};localStorage.setItem(roomKey(code),JSON.stringify(r));return setSession({code,pid:r.people[0].id})}let code=(document.getElementById('code')?.value||'').trim();r=JSON.parse(localStorage.getItem(roomKey(code))||'null');if(!r)return alertMsg('找不到房間。請確認房號；此測試版僅支援同一裝置的不同分頁。');if(r.phase!=='lobby')return alertMsg('此房間正在進行遊戲，暫時不能加入。');if(r.people.some(p=>p.name===name))return alertMsg('房內已有相同暱稱，請換一個。');let p={id:uid(),name,host:false,score:0};r.people.push(p);localStorage.setItem(roomKey(code),JSON.stringify(r));return setSession({code,pid:p.id})}if(!r)return render();let me=getMe(r),ishost=host(r);if(action==='copy'){let url=new URL(location.href);url.searchParams.set('room',r.code);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(`Sante Taipei 兩真一假｜房號 ${r.code}\n${url}`).then(()=>alertMsg('邀請文字已複製（正式跨手機連線仍需後端）。')).catch(()=>alertMsg('房號：'+r.code));else alertMsg('房號：'+r.code);return}if(action==='leave'){if(ishost){if(!confirm('關主離開後會轉交給下一位隊員。確定離開？'))return}r.people=r.people.filter(p=>p.id!==me.id);if(ishost&&r.people[0])r.people[0].host=true;if(!r.people.length)localStorage.removeItem(roomKey(r.code));else localStorage.setItem(roomKey(r.code),JSON.stringify(r));session=null;sessionStorage.removeItem(SESSION);return render()}if(action==='edit'&&r.phase==='lobby'){return setSession({...session,editing:true})}if(action==='back'&&session.editing){return setSession({...session,editing:false})}if(action==='submit'&&r.phase==='lobby'&&session.editing){let a=[0,1,2].map(i=>document.getElementById('statement'+i).value.trim());let lie=document.querySelector('input[name="lie"]:checked');if(a.some(s=>!s))return alertMsg('請填完三句話。');if(new Set(a).size!==3)return alertMsg('三句話不能完全相同。');if(!lie)return alertMsg('請選擇哪一句是假話。');me.statements=a;me.lie=Number(lie.value);session.editing=false;sessionStorage.setItem(SESSION,JSON.stringify(session));return save(r)}if(action==='start'&&ishost&&r.phase==='lobby'){let ids=r.people.filter(p=>p.statements?.length===3).map(p=>p.id);if(ids.length===0||r.people.length<2)return alertMsg('至少兩人加入，並至少一人出題。');r.order=ids.sort(()=>Math.random()-.5);r.round=0;r.votes={};r.people.forEach(p=>p.score=0);r.phase='play';return save(r)}if(action==='vote'&&r.phase==='play'){let subject=r.order[r.round];if(subject===me.id)return alertMsg('不能投票給自己的題目。');r.votes[me.id]=Number(val);return save(r)}if(action==='reveal'&&ishost&&r.phase==='play'){const sub=r.people.find(p=>p.id===r.order[r.round]);for(let [id,v] of Object.entries(r.votes)){if(v===sub.lie){let p=r.people.find(p=>p.id===id);if(p)p.score=(p.score||0)+1}}r.phase='reveal';return save(r)}if(action==='next'&&ishost&&r.phase==='reveal'){r.round++;r.votes={};r.phase=r.round>=r.order.length?'finished':'play';return save(r)}if(action==='restart'&&ishost&&r.phase==='finished'){r.phase='lobby';r.round=0;r.order=[];r.votes={};r.people.forEach(p=>{p.score=0;delete p.statements;delete p.lie});return save(r)}}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)write(b.dataset.action,b.dataset.val)});window.addEventListener('storage',e=>{if(session&&e.key===roomKey(session.code))render()});render();
})();
</script></body></html>
